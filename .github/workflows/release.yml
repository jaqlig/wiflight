name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag matching versionName (for example v0.1.0)'
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  SIGNING_CERT_SHA256: 1cc4fac50af0fd30811b7eff68bacdc2c12ff06b6a0d4669ca105542ccefc6ad

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version-code: ${{ steps.version.outputs.version-code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check release version and source
        id: version
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" != refs/heads/main ]]; then
            echo '::error::Run manual releases from main.'
            exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          config = Path('app/build.gradle.kts').read_text()
          version = re.search(r'versionName\s*=\s*"([^"]+)"', config).group(1)
          code = re.search(r'versionCode\s*=\s*(\d+)', config).group(1)
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v\d+\.\d+\.\d+', tag) or tag != f'v{version}':
              raise SystemExit('Release tag must match the stable versionName in app/build.gradle.kts.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\nversion-code={code}\n')
          PY
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          fi
      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.WIFLIGHT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.WIFLIGHT_KEYSTORE_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" ]]; then
            echo '::error::Add WIFLIGHT_KEYSTORE_BASE64 and WIFLIGHT_KEYSTORE_PASSWORD in repository Settings > Secrets and variables > Actions.'
            exit 1
          fi
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      # v5 retains fully open-source caching. Signing secrets are never passed to Gradle.
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Verify wrapper and install SDK
        run: |
          python3 scripts/bootstrap-wrapper.py
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test, lint, and build unsigned release
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug lintRelease assembleRelease
      - name: Sign and verify APK
        env:
          KEYSTORE_BASE64: ${{ secrets.WIFLIGHT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.WIFLIGHT_KEYSTORE_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version-code }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > "$RUNNER_TEMP/wiflight-release.p12"
          KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD//$'\r'/}
          KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD//$'\n'/}
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          analyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          unsigned=app/build/outputs/apk/release/app-release-unsigned.apk
          mkdir -p dist
          apk="dist/WiFlight-$VERSION.apk"
          "$build_tools/zipalign" -c -P 16 4 "$unsigned"
          "$build_tools/apksigner" sign \
            --ks "$RUNNER_TEMP/wiflight-release.p12" --ks-key-alias wiflight \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --v4-signing-enabled false --out "$apk" "$unsigned"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/wiflight-signature.txt"
          actual_cert=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/wiflight-signature.txt")
          test "$actual_cert" = "$SIGNING_CERT_SHA256"
          test "$("$analyzer" manifest application-id "$apk")" = io.github.jaqlig.wiflight
          test "$("$analyzer" manifest version-name "$apk")" = "$VERSION"
          test "$("$analyzer" manifest version-code "$apk")" = "$VERSION_CODE"
          test "$("$analyzer" manifest debuggable "$apk")" = false
          cd dist
          sha256sum "WiFlight-$VERSION.apk" > SHA256SUMS
      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/wiflight-release.p12"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wiflight-signed-release
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wiflight-signed-release
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          TARGET_COMMIT: ${{ github.sha }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Requires **Android 14 or newer** and configured Wi-Fi calling. See the [setup instructions](https://github.com/$GH_REPO/blob/$TARGET_COMMIT/README.md#setup) for the required permission grant.

          Download **WiFlight-$VERSION.apk**. SHA-256 checksums are included in **SHA256SUMS**.

          Signing certificate SHA-256: \`$SIGNING_CERT_SHA256\`.
          EOF
          if [[ "$VERSION" == 0.1.0 ]]; then
            printf '\nThis release uses a dedicated signing key. Uninstall any development build before installing it, then repeat setup. Future GitHub releases can update this release normally.\n' >> "$RUNNER_TEMP/release-notes.md"
          fi
          if gh release view "$RELEASE_TAG" --json isDraft,targetCommitish > "$RUNNER_TEMP/existing-release.json" 2>/dev/null; then
            python3 - <<'PY'
          import json, os
          from pathlib import Path
          release = json.loads((Path(os.environ['RUNNER_TEMP']) / 'existing-release.json').read_text())
          if not release['isDraft'] or release['targetCommitish'] != os.environ['TARGET_COMMIT']:
              raise SystemExit('Refusing to replace an existing published release or a draft for another commit.')
          PY
            gh release upload "$RELEASE_TAG" "WiFlight-$VERSION.apk" SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" "WiFlight-$VERSION.apk" SHA256SUMS \
              --target "$TARGET_COMMIT" --title "WiFlight $VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.md" --draft
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest
